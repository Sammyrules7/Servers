apiVersion: batch/v1
kind: Job
metadata:
  name: satisfactory-bootstrap
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: docker.io/wolveix/satisfactory-server:v1.9.11
          command: [/bin/bash, /scripts/bootstrap.sh]
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: satisfactory-passwords
                  key: admin-password
            - name: PLAYER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: satisfactory-passwords
                  key: player-password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: satisfactory-bootstrap
