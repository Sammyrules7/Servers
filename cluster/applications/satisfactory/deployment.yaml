apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: satisfactory-data-longhorn
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satisfactory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: satisfactory
  template:
    metadata:
      labels:
        app: satisfactory
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - home
      containers:
        - name: server
          image: docker.io/wolveix/satisfactory-server:v1.9.10
          command: [/bin/bash, /scripts/start.sh]
          env:
            - name: MAXPLAYERS
              value: "4"
            - name: AUTOSAVENUM
              value: "10"
            - name: MULTIHOME
              value: "0.0.0.0"
          ports:
            - name: api
              containerPort: 7777
              protocol: TCP
            - name: game
              containerPort: 7777
              protocol: UDP
            - name: messaging
              containerPort: 8888
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /config
            - name: tls
              mountPath: /certificates
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: satisfactory-data-longhorn
        - name: tls
          secret:
            secretName: satisfactory-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: cert_chain.pem
              - key: tls.key
                path: private_key.pem
        - name: scripts
          configMap:
            name: satisfactory-start
