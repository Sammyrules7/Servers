apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m0s
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  chart:
    spec:
      chart: authentik
      version: "2026.8.x"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  interval: 15m0s
  valuesFrom:
    - kind: Secret
      name: db-creds
      valuesKey: values.yaml
    - kind: Secret
      name: authentik-secret-key
      valuesKey: values.yaml
  values:
    authentik:
      postgresql:
        # Authentik uses session advisory locks, which are unsafe through the
        # transaction-pooled PgBouncer service because the locks can leak.
        host: postgres-rw.postgres.svc.cluster.local
    error_reporting:
      enabled: false
    server:
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
    worker:
      # A rolling update keeps the old singleton worker holding the database lock,
      # so the replacement never creates its health socket. Recreate it instead.
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 1Gi
