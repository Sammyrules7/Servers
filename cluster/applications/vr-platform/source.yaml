apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vr-platform
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: Multiplayer
  url: https://forgejo.maio-tech.com/Sammy/Generic-Vr-Platform.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vr-platform
  namespace: flux-system
spec:
  interval: 5m
  path: ./cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: vr-platform
  timeout: 2m
  wait: true
