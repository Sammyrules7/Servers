apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vr-platform-web-origin
  namespace: garage-cluster
spec:
  parentRefs:
    - name: gateway
      namespace: ingress
  hostnames:
    - vr-builds-origin.svc.maio-tech.com
  rules:
    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: vr-platform-web.garage-main-cluster.garage-cluster.svc
      timeouts:
        request: 0s
        backendRequest: 300s
      backendRefs:
        - name: garage-main-cluster
          port: 3902
