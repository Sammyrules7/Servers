apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: vr-platform-web
  namespace: forgejo
spec:
  clusterRef:
    name: garage-main-cluster
    namespace: garage-cluster
  globalAlias: vr-platform-web
  quotas:
    maxSize: 5Gi
    maxObjects: 1000
  website:
    enabled: true
    indexDocument: index.html
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: vr-platform-web-publisher
  namespace: forgejo
spec:
  clusterRef:
    name: garage-main-cluster
    namespace: garage-cluster
  name: vr-platform-web-publisher
  secretTemplate:
    name: vr-platform-web-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    endpointKey: S3_ENDPOINT
    regionKey: AWS_REGION
    includeEndpoint: true
    includeRegion: true
  bucketPermissions:
    - bucketRef:
        name: vr-platform-web
      read: true
      write: true
