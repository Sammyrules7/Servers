apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t3-code-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: t3-code-machine-info
data:
  machine-info: |
    PRETTY_HOSTNAME="Kubernetes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-code
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: t3-code
  template:
    metadata:
      labels:
        app: t3-code
    spec:
      hostname: kubernetes
      # T3 keys a repository by the host `git remote get-url` reports and matches
      # it against the host on each pull request link, so the pod answers Forgejo's
      # public name itself (runtime/forward-forgejo.py) rather than rewriting Git to
      # the in-cluster service. This pod only; cluster DNS is untouched.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - forgejo.maio-tech.com
      serviceAccountName: t3-code
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1773
        runAsGroup: 1773
        runAsNonRoot: true
        fsGroup: 1773
        fsGroupChangePolicy: OnRootMismatch
      # server2 is the oldest, slowest machine. Prefer any other node by name, but
      # keep the pod schedulable there so a loss of the other nodes or capacity
      # pressure still lets T3 start.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - server2
      containers:
        - name: t3-code
          image: nix:0/nix/store/gyfrzn8fzqndfz5p1jhzn393pi1r9k2l-nix-image-t3-code.tar
          imagePullPolicy: IfNotPresent
          command: [/bin/python3, /etc/t3-code/runtime/start.py]
          env:
            - name: CODEX_HOME
              value: /data/home/.codex
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # The forwarder listens on the ports Forgejo's URLs use.
              add: [NET_BIND_SERVICE]
          ports:
            - name: http
              containerPort: 3773
          startupProbe:
            httpGet:
              path: /
              port: http
            # First boot may download both provider and server binaries.
            failureThreshold: 240
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: runtime
              mountPath: /etc/t3-code/runtime
              readOnly: true
            - name: machine-info
              mountPath: /etc/machine-info
              subPath: machine-info
              readOnly: true
            - name: cli-tokens
              mountPath: /run/cli-tokens
              readOnly: true
            - name: forgejo-tls
              mountPath: /etc/t3-code/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: nix-gcroots
              mountPath: /nix/var/nix/gcroots/t3-code
            - name: nix-store
              mountPath: /nix/store
              readOnly: true
            - name: nix-daemon
              mountPath: /nix/var/nix/daemon-socket
              readOnly: true
      volumes:
        - name: runtime
          configMap:
            name: t3-code-runtime
        - name: machine-info
          configMap:
            name: t3-code-machine-info
        - name: cli-tokens
          secret:
            secretName: t3-code-cli-tokens
            defaultMode: 0440
        - name: forgejo-tls
          secret:
            secretName: t3-code-forgejo-tls
            # The pod still serves Git, T3 and the plaintext port when the
            # certificate is missing; only the https listener reports the failure.
            optional: true
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        - name: nix-gcroots
          hostPath:
            path: /nix/var/nix/gcroots/t3-code
            type: Directory
        - name: data
          persistentVolumeClaim:
            claimName: t3-code-data
        - name: nix-store
          hostPath:
            path: /nix/store
            type: Directory
        - name: nix-daemon
          hostPath:
            path: /nix/var/nix/daemon-socket
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: t3-code
spec:
  publishNotReadyAddresses: true
  selector:
    app: t3-code
  ports:
    - name: http
      port: 3773
      targetPort: http
