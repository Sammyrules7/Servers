apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3-code
---
# Full permissions except Secrets. RBAC is additive with no deny rules, so
# Secrets are excluded by enumerating the core ("") resources instead of
# using a wildcard. `secrets` has no subresources, so omitting it denies all
# Secret access. Non-core groups use resource wildcards; a wholly new API
# group must be added here to be covered.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: t3-code-full
rules:
  - apiGroups: [""]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["*"]
  - apiGroups: [""]
    resources:
      - pods/attach
      - pods/eviction
      - pods/exec
      - pods/log
      - pods/portforward
      - pods/proxy
      - pods/ephemeralcontainers
      - pods/status
      - nodes/proxy
      - nodes/status
      - services/proxy
      - services/status
      - namespaces/status
      - namespaces/finalize
      - persistentvolumeclaims/status
      - persistentvolumes/status
      - serviceaccounts/token
      - serviceaccounts/status
      - replicationcontrollers/status
      - resourcequotas/status
      - endpoints/status
      - events/status
    verbs: ["*"]
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: ["*"]
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - gateway.networking.k8s.io
      - gateway.envoyproxy.io
      - cert-manager.io
      - acme.cert-manager.io
      - cert-manager.k8s.cloudflare.com
      - monitoring.coreos.com
      - operator.victoriametrics.com
      - postgresql.cnpg.io
      - garage.rajsingh.info
      - openclaw.rocks
      - longhorn.io
      - keda.sh
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: t3-code-full
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: t3-code-full
subjects:
  - kind: ServiceAccount
    name: t3-code
    namespace: t3-code
