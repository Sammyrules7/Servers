apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: luanti
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://forgejo.maio-tech.com/Sammy/Luanti.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: luanti
  namespace: flux-system
spec:
  interval: 5m
  path: ./cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: luanti
  timeout: 5m
  wait: true
