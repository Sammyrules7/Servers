apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: attic
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: attic
  comment: Attic application role
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  passwordSecret:
    name: attic-db-role
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: attic
  namespace: postgres
spec:
  name: attic
  cluster:
    name: postgres
  owner: attic
