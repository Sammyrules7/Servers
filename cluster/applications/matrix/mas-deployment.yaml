apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-mas
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matrix-mas
  template:
    metadata:
      labels:
        app: matrix-mas
    spec:
      initContainers:
        - name: render-config
          image: docker.io/mikefarah/yq:4.53.3
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cp /templates/config.yaml /rendered/config.yaml
              yq -i '
                .database.password = strenv(MAS_DB_PASSWORD) |
                .upstream_oauth2.providers[0].client_id = strenv(AUTHENTIK_CLIENT_ID)
              ' /rendered/config.yaml
          env:
            - name: MAS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-mas-runtime
                  key: database-password
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: matrix-oidc
                  key: AUTHENTIK_CLIENT_ID
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config-template
              mountPath: /templates
            - name: rendered-config
              mountPath: /rendered
      containers:
        - name: mas
          image: ghcr.io/element-hq/matrix-authentication-service@sha256:73bb86fb8f412082829e603417b2df3e351bbda79bedaa46beb0f3f533bdcc1c
          args:
            - server
            - --config
            - /etc/mas/config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/mas/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: mas-secrets
              mountPath: /run/mas-secrets
              readOnly: true
            - name: oidc-secret
              mountPath: /run/oidc
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config-template
          configMap:
            name: matrix-mas-config
        - name: rendered-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: mas-secrets
          secret:
            secretName: matrix-mas-runtime
        - name: oidc-secret
          secret:
            secretName: matrix-oidc
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-mas
  namespace: matrix
  labels:
    app: matrix-mas
spec:
  selector:
    app: matrix-mas
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
