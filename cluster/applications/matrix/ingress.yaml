apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
  namespace: matrix
spec:
  parentRefs:
    - name: gateway
      namespace: ingress
  hostnames:
    - "matrix.maio-tech.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
        backendRequest: 300s
      backendRefs:
        - name: matrix
          port: 8008
