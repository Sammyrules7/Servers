- op: add
  path: /spec/initContainers/-
  value:
    name: install-go
    image: golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -ec
    args:
      - |
        mkdir -p /data/.local/bin /data/.local/share /data/.local/share/gopath
        go_version="$(/usr/local/go/bin/go env GOVERSION)"
        if [ ! -f "/data/.local/.${go_version}" ]; then
          rm -rf /data/.local/share/go
          cp -a /usr/local/go /data/.local/share/go
          touch "/data/.local/.${go_version}"
        fi
        printf '%s\n' \
          '#!/bin/sh' \
          'export GOROOT=/home/openclaw/.local/share/go' \
          'export GOPATH=/home/openclaw/.local/share/gopath' \
          'export GOBIN=/home/openclaw/.local/bin' \
          'exec "$GOROOT/bin/go" "$@"' \
          > /data/.local/bin/go
        printf '%s\n' \
          '#!/bin/sh' \
          'export GOROOT=/home/openclaw/.local/share/go' \
          'exec "$GOROOT/bin/gofmt" "$@"' \
          > /data/.local/bin/gofmt
        chmod 0755 /data/.local/bin/go /data/.local/bin/gofmt
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    volumeMounts:
      - name: data
        mountPath: /data
- op: add
  path: /spec/initContainers/-
  value:
    name: install-forgejo-tools
    image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -ec
    args:
      - |
        mkdir -p /data/.local/bin /data/workspace/skills/forgejo /tmp/forgejo-tools
        if [ ! -f /data/.local/.tea-0.16.0 ]; then
          curl -fsSL -o /tmp/forgejo-tools/tea \
            https://gitea.com/gitea/tea/releases/download/v0.16.0/tea-0.16.0-linux-amd64
          curl -fsSL -o /tmp/forgejo-tools/tea-checksums.txt \
            https://gitea.com/gitea/tea/releases/download/v0.16.0/checksums.txt
          tea_sha256="$(awk '$2 == "tea-0.16.0-linux-amd64" { print $1 }' /tmp/forgejo-tools/tea-checksums.txt)"
          test "${#tea_sha256}" -eq 64
          echo "${tea_sha256}  /tmp/forgejo-tools/tea" | sha256sum -c -
          install -m 0755 /tmp/forgejo-tools/tea /data/.local/bin/tea
          touch /data/.local/.tea-0.16.0
        fi
        # Pinned upstream release; install CLI only, never provision credentials.
        if [ ! -x /data/.local/bin/gh ] || [ ! -f /data/.local/.gh-2.103.2 ]; then
          curl -fsSL -o /tmp/forgejo-tools/gh.tar.gz \
            https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz
          echo "62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8  /tmp/forgejo-tools/gh.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/forgejo-tools/gh.tar.gz -C /tmp/forgejo-tools \
            gh_2.103.2_linux_amd64/bin/gh
          install -m 0755 /tmp/forgejo-tools/gh_2.103.2_linux_amd64/bin/gh /data/.local/bin/gh
          /data/.local/bin/gh --version
          touch /data/.local/.gh-2.103.2
        fi
        cp /tooling/forgejo-SKILL.md /data/workspace/skills/forgejo/SKILL.md
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
    volumeMounts:
      - name: data
        mountPath: /data
      - name: tooling-skills
        mountPath: /tooling
        readOnly: true
