apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: all-instances
spec:
  config:
    raw:
      models:
        providers:
          openai:
            baseUrl: https://chatgpt.com/backend-api/codex
            api: openai-chatgpt-responses
            models:
              - id: gpt-6.1-sol
                name: GPT-6.1 Sol
                reasoning: true
                input: [text, image]
                contextWindow: 1050000
                maxTokens: 128000
                cost:
                  input: 2
                  output: 10
                  cacheRead: 0.1
                  cacheWrite: 2.5
