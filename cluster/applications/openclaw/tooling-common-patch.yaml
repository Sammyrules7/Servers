- op: add
  path: /spec/env
  value:
    - name: PATH
      value: /home/openclaw/.local/bin:/home/openclaw/.openclaw/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
- op: add
  path: /spec/config/raw/diagnostics
  value:
    enabled: true
    otel:
      enabled: true
      endpoint: http://localhost:4318
      protocol: http/protobuf
      metrics: true
      traces: false
      logs: false
      flushIntervalMs: 15000
- op: add
  path: /spec/sidecarVolumes
  value:
    - name: tooling-skills
      configMap:
        name: openclaw-tooling-skills
- op: add
  path: /spec/initContainers
  value:
    - name: install-common-tools
      image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -ec
      args:
        - |
          mkdir -p \
            /data/.local/bin \
            /data/workspace/skills/developer-tooling \
            /data/workspace/skills/gog \
            /tmp/openclaw-tools

          if [ ! -f /data/.local/.jq-1.8.2 ]; then
            curl -fsSL -o /tmp/openclaw-tools/jq \
              https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
            echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  /tmp/openclaw-tools/jq" \
              | sha256sum -c -
            install -m 0755 /tmp/openclaw-tools/jq /data/.local/bin/jq
            touch /data/.local/.jq-1.8.2
          fi

          if [ ! -f /data/.local/.gog-0.47.0 ]; then
            curl -fsSL -o /tmp/openclaw-tools/gog.tar.gz \
              https://github.com/steipete/gogcli/releases/download/v0.47.0/gogcli_0.47.0_linux_amd64.tar.gz
            echo "c3ed94efca90c754cdda300e3c7f8cc2f3d7df86d3fdc5d11f996c7518a09c24  /tmp/openclaw-tools/gog.tar.gz" \
              | sha256sum -c -
            tar -xzf /tmp/openclaw-tools/gog.tar.gz -C /tmp/openclaw-tools
            install -m 0755 /tmp/openclaw-tools/gog /data/.local/bin/gog
            touch /data/.local/.gog-0.47.0
          fi

          cp /tooling/developer-tooling-SKILL.md \
            /data/workspace/skills/developer-tooling/SKILL.md
          cp /tooling/gog-SKILL.md \
            /data/workspace/skills/gog/SKILL.md
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      volumeMounts:
        - name: data
          mountPath: /data
        - name: tooling-skills
          mountPath: /tooling
          readOnly: true
    - name: setup-python-pip
      image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -ec
      args:
        - |
          python_target="$(readlink /data/.local/bin/python)"
          python_bin_dir="$(dirname "${python_target}")"
          ln -sf "${python_bin_dir}/pip" /data/.local/bin/pip
          ln -sf "${python_bin_dir}/pip3" /data/.local/bin/pip3
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
        - name: data
          mountPath: /data
