apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: smart
spec:
  jobName: smart
  targetEndpoints:
    - targets: ["100.74.161.102:9633"]
      labels:
        node: server1
    - targets: ["100.86.214.46:9633"]
      labels:
        node: server2
    - targets: ["100.119.85.83:9633"]
      labels:
        node: server3
    - targets: ["100.101.5.33:9633"]
      labels:
        node: server4
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: smart
spec:
  groups:
    - name: smart
      rules:
        - alert: SmartDiskFailed
          expr: smartctl_device_smart_status == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "SMART FAILED on {{ $labels.node }} {{ $labels.device }}"
            description: "Disable scheduling on the matching Longhorn disk immediately, even if Longhorn reports Ready. See monitoring/SMART.md."
        - alert: SmartEnduranceUsed
          expr: smartctl_device_percentage_used >= 90 or smartctl_scsi_percentage_used_endurance_indicator >= 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "At least 90% endurance consumed on {{ $labels.node }} {{ $labels.device }}"
        - alert: SmartWearThreshold
          expr: |
            smartctl_device_attribute{attribute_value_type="value",attribute_name=~"Wear_Leveling_Count|Media_Wearout_Indicator|SSD_Life_Left|Percent_Lifetime_Remain"} <= 10
            or
            smartctl_device_attribute{attribute_value_type="value",attribute_name=~"Wear_Leveling_Count|Media_Wearout_Indicator|SSD_Life_Left|Percent_Lifetime_Remain"}
              <= ignoring(attribute_value_type)
            smartctl_device_attribute{attribute_value_type="thresh",attribute_name=~"Wear_Leveling_Count|Media_Wearout_Indicator|SSD_Life_Left|Percent_Lifetime_Remain"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Vendor wear threshold reached on {{ $labels.node }} {{ $labels.device }}"
        - alert: SmartMediaErrors
          expr: smartctl_device_media_errors > 0 or smartctl_device_attribute{attribute_value_type="raw",attribute_id=~"5|197|198"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Media errors or bad sectors on {{ $labels.node }} {{ $labels.device }}"
        - alert: SmartDiskHot
          expr: smartctl_device_temperature{temperature_type="current"} >= 65
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Disk temperature at least 65 C on {{ $labels.node }} {{ $labels.device }}"
        - alert: SmartResetGrowth
          expr: delta(smartctl_device_attribute{attribute_value_type="raw",attribute_name=~"Unexpected_Power_Loss|Power-Off_Retract_Count|POR_Recovery_Count"}[1h]) > 0 or delta(smartctl_device_power_cycle_count[1h]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Unexpected power loss or repeated resets on {{ $labels.node }} {{ $labels.device }}"
        - alert: SmartExporterDown
          expr: up{job="smart"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SMART exporter unavailable on {{ $labels.node }}"
