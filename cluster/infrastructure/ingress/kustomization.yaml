apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
  # Envoy Gateway requires its CRDs to be upgraded before the controller.
  # Keep these separate because the HelmRelease deliberately skips CRDs.
  - https://github.com/envoyproxy/gateway/releases/download/v1.8.3/envoy-gateway-crds.yaml
  - ./main-setup
  - ./envoy
  - ./cert-manager
  - ./cloudflare-origin-certs
