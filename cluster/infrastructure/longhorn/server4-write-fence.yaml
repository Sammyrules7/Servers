# Keep existing replicas running; only prevent NEW replica placement.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server4-write-fence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server4-write-fence
rules:
  - apiGroups: [longhorn.io]
    resources: [nodes]
    resourceNames: [server4]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server4-write-fence
subjects:
  - kind: ServiceAccount
    name: server4-write-fence
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server4-write-fence
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: server4-write-fence
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: server4-write-fence
          restartPolicy: Never
          containers:
            - name: fence
              image: docker.io/alpine/kubectl:1.34.1@sha256:8413f8890d19aa03f63851654f642957e65ba59654b0c9357ddc6ec0b05b63a6
              command: [/bin/sh, -ec]
              args:
                - |
                  # Merge only scheduling flags; preserve paths, reservations,
                  # tags, replicas and eviction settings. Discover disk keys.
                  patch=$(kubectl -n longhorn-system get nodes.longhorn.io server4 -o go-template='{"spec":{"allowScheduling":false,"disks":{ {{- $first := true -}}{{- range $name, $disk := .spec.disks -}}{{- if not $first -}},{{- end -}}{{- $first = false -}}{{printf "%q" $name}}:{"allowScheduling":false}{{- end -}} }}}')
                  kubectl -n longhorn-system patch nodes.longhorn.io server4 --type=merge -p "$patch"
