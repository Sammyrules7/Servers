apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: inteldeviceplugins-system
spec:
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: "0.37.1"
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  interval: 1h
  values:
    devices:
      gpu: true
