apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lightning-db
spec:
  instances: 1
  bootstrap:
    initdb:
      database: lightning
      owner: lightning
  storage:
    storageClass: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: server1
