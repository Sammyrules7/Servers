# GarageReferenceGrants allowing cross-namespace buckets/keys to reference
# the shared garage cluster. Without these, the operator's admission webhook
# rejects the cross-namespace clusterRef.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: luanti-bucket
  namespace: garage-cluster
spec:
  from:
    - kind: GarageBucket
      namespace: luanti
    - kind: GarageKey
      namespace: luanti
  to:
    - kind: GarageCluster
      name: garage-main-cluster
---
# Allows Forgejo's garage buckets/keys (namespace forgejo) to reference the
# shared garage cluster. Without this, the operator's admission webhook
# rejects the cross-namespace clusterRef (attic/forgejo/matrix buckets all
# show Phase: Failed for the same missing-grant reason).
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: forgejo-bucket
  namespace: garage-cluster
spec:
  from:
    - kind: GarageBucket
      namespace: forgejo
    - kind: GarageKey
      namespace: forgejo
  to:
    - kind: GarageCluster
      name: garage-main-cluster
